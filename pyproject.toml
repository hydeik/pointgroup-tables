[project]
name = "pointgroup-tables"
version = "0.1.0"
description = "Exact character tables, irrep matrices and double-group tables of the finite point groups"
readme = "README.md"
authors = [
    { name = "Hidekazu Ikeno", email = "hide.ikeno@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
pointgroup-tables = "pointgroup_tables:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mpmath>=1.4.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.5",
    "ty>=0.0.77",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ty.environment]
extra-paths = ["prototypes", "tools", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: large groups and the exhaustive checks on |G-dagger| > 96 (deselected by default)",
    "reference: needs a file under tests/reference/; skipped with a reason when it is absent",
]
