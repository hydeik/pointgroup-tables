# Canonical basis convention: the polyhedral generator data frozen by
# prototypes/canonical_basis_prototype.py (wayfinder ticket #16).
# Regenerate with: uv run python prototypes/canonical_basis_prototype.py --write

name = "canonical"

[axial]
rule = "canonical"

[polyhedral.2T]
conductor = 12
generators = ["C3^1(1)", "C2(1)"]

[polyhedral.2T.irreps.T]  # rotation matrix of q, in the eigenbasis of C3
matrices = [
  [["zeta^4", "0", "0"], ["0", "1", "0"], ["0", "0", "zeta^8"]],
  [["-1/3", "2/3", "2/3"], ["2/3", "-1/3", "2/3"], ["2/3", "2/3", "-1/3"]],
]

[polyhedral.2T.irreps."E1/2"]  # spinor map psi(q)
matrices = [
  [["zeta^2", "0"], ["0", "zeta^10"]],
  [["1/3*i*sqrt3", "1/2 - 1/2*i + 1/6*sqrt3 + 1/6*i*sqrt3"], ["-1/2 - 1/2*i - 1/6*sqrt3 + 1/6*i*sqrt3", "-1/3*i*sqrt3"]],
]

[polyhedral.2T.irreps."1E3/2"]  # block of E1/2 x T
matrices = [
  [["-1", "0"], ["0", "zeta^2"]],
  [["1/3*i*sqrt3", "1/2 - 1/2*i - 1/6*sqrt3 - 1/6*i*sqrt3"], ["-1/2 - 1/2*i + 1/6*sqrt3 - 1/6*i*sqrt3", "-1/3*i*sqrt3"]],
]

[polyhedral.2T.irreps."2E3/2"]  # block of E1/2 x T
matrices = [
  [["-1", "0"], ["0", "zeta^10"]],
  [["-1/3*i*sqrt3", "1/3*sqrt3 + 1/3*i*sqrt3"], ["-1/3*sqrt3 + 1/3*i*sqrt3", "1/3*i*sqrt3"]],
]

[polyhedral.2O]
conductor = 8
generators = ["C4^1(1)", "C2'(1)"]

[polyhedral.2O.irreps.E]  # block of T1 x T1
matrices = [
  [["-1", "0"], ["0", "1"]],
  [["1/2", "-1/2*i - 1/2*sqrt2"], ["1/2*i - 1/2*sqrt2", "-1/2"]],
]

[polyhedral.2O.irreps.T1]  # rotation matrix of q, in the eigenbasis of C4
matrices = [
  [["zeta^2", "0", "0"], ["0", "1", "0"], ["0", "0", "zeta^6"]],
  [["-1/2", "1/2*sqrt2", "1/2"], ["1/2*sqrt2", "0", "1/2*sqrt2"], ["1/2", "1/2*sqrt2", "-1/2"]],
]

[polyhedral.2O.irreps.T2]  # A2 x T1
matrices = [
  [["-1", "0", "0"], ["0", "zeta^2", "0"], ["0", "0", "zeta^6"]],
  [["0", "-1/2*sqrt2", "-1/2*sqrt2"], ["-1/2*sqrt2", "1/2", "-1/2"], ["-1/2*sqrt2", "-1/2", "1/2"]],
]

[polyhedral.2O.irreps."E1/2"]  # spinor map psi(q)
matrices = [
  [["zeta", "0"], ["0", "zeta^7"]],
  [["1/2*i*sqrt2", "-1/2*sqrt2"], ["1/2*sqrt2", "-1/2*i*sqrt2"]],
]

[polyhedral.2O.irreps."E5/2"]  # A2 x E1/2
matrices = [
  [["zeta^3", "0"], ["0", "zeta^5"]],
  [["1/2*i*sqrt2", "-1/2*sqrt2"], ["1/2*sqrt2", "-1/2*i*sqrt2"]],
