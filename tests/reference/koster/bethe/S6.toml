# Koster, Dimmock, Wheeler & Statz, Properties of the Thirty-Two Point Groups (1963): Bethe symbols of S6
# Format: tests/reference/koster/bethe/README.md
#
# S6: 12 irreps (6 ordinary, 6 projective), in canonical order.
# Each entry lists the characters on the identifying elements below; for a projective
# irrep they are the characters of the lifted elements in the canonical section.
# Find the row with these characters in Koster's table and copy its Gamma symbol into
# bethe ("Gamma3", with the parity sign in this centrosymmetric group: "Gamma3+" / "Gamma3-").

group = "S6"
table = "Table 47, p. 54" # Koster's table and page for this group, e.g. "Table 33, p. 62"
status = "done"           # todo | partial | done
notes = ""                # disagreements with Bradley & Cracknell or Bilbao; anything unreadable
elements = ["C3^1", "i"]

[[irreps]]
symbol = "Ag"
dimension = 1
projective = false
characters = ["1", "1"]
bethe = "Gamma1+"

[[irreps]]
symbol = "1Eg"
dimension = 1
projective = false
characters = ["zeta3", "1"]
numeric = ["-0.5000+0.8660i", "+1.0000+0.0000i"]
bethe = "Gamma2+"

[[irreps]]
symbol = "2Eg"
dimension = 1
projective = false
characters = ["zeta3^2", "1"]
numeric = ["-0.5000-0.8660i", "+1.0000+0.0000i"]
bethe = "Gamma3+"

[[irreps]]
symbol = "Au"
dimension = 1
projective = false
characters = ["1", "-1"]
bethe = "Gamma1-"

[[irreps]]
symbol = "1Eu"
dimension = 1
projective = false
characters = ["zeta3", "-1"]
numeric = ["-0.5000+0.8660i", "-1.0000+0.0000i"]
bethe = "Gamma2-"

[[irreps]]
symbol = "2Eu"
dimension = 1
projective = false
characters = ["zeta3^2", "-1"]
numeric = ["-0.5000-0.8660i", "-1.0000+0.0000i"]
bethe = "Gamma3-"

[[irreps]]
symbol = "B3/2g"
dimension = 1
projective = true
characters = ["-1", "1"]
bethe = "Gamma6+"

[[irreps]]
symbol = "1E1/2g"
dimension = 1
projective = true
characters = ["-zeta3^2", "1"]
numeric = ["+0.5000+0.8660i", "+1.0000+0.0000i"]
bethe = "Gamma4+"

[[irreps]]
symbol = "2E1/2g"
dimension = 1
projective = true
characters = ["-zeta3", "1"]
numeric = ["+0.5000-0.8660i", "+1.0000+0.0000i"]
bethe = "Gamma5+"

[[irreps]]
symbol = "B3/2u"
dimension = 1
projective = true
characters = ["-1", "-1"]
bethe = "Gamma6-"

[[irreps]]
symbol = "1E1/2u"
dimension = 1
projective = true
characters = ["-zeta3^2", "-1"]
numeric = ["+0.5000+0.8660i", "-1.0000+0.0000i"]
bethe = "Gamma4-"

[[irreps]]
symbol = "2E1/2u"
dimension = 1
projective = true
characters = ["-zeta3", "-1"]
numeric = ["+0.5000-0.8660i", "-1.0000+0.0000i"]
bethe = "Gamma5-"
