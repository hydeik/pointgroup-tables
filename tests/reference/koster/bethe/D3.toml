# Koster, Dimmock, Wheeler & Statz, Properties of the Thirty-Two Point Groups (1963): Bethe symbols of D3
# Format: tests/reference/koster/bethe/README.md
#
# D3: 6 irreps (3 ordinary, 3 projective), in canonical order.
# Each entry lists the characters on the identifying elements below; for a projective
# irrep they are the characters of the lifted elements in the canonical section.
# Find the row with these characters in Koster's table and copy its Gamma symbol into
# bethe ("Gamma3"; no parity sign in this group).

group = "D3"
table = ""          # Koster's table and page for this group, e.g. "Table 33, p. 62"
status = "todo"     # todo | partial | done
notes = ""          # disagreements with Bradley & Cracknell or Bilbao; anything unreadable
elements = ["C3^1", "C2'(1)"]

[[irreps]]
symbol = "A1"
dimension = 1
projective = false
characters = ["1", "1"]
bethe = ""

[[irreps]]
symbol = "A2"
dimension = 1
projective = false
characters = ["1", "-1"]
bethe = ""

[[irreps]]
symbol = "E"
dimension = 2
projective = false
characters = ["-1", "0"]
bethe = ""

[[irreps]]
symbol = "E1/2"
dimension = 2
projective = true
characters = ["1", "0"]
bethe = ""

[[irreps]]
symbol = "1E3/2"
dimension = 1
projective = true
characters = ["-1", "i"]
numeric = ["-1.0000+0.0000i", "+0.0000+1.0000i"]
bethe = ""

[[irreps]]
symbol = "2E3/2"
dimension = 1
projective = true
characters = ["-1", "-i"]
numeric = ["-1.0000+0.0000i", "+0.0000-1.0000i"]
bethe = ""

