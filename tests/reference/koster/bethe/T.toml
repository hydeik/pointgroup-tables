# Koster, Dimmock, Wheeler & Statz, Properties of the Thirty-Two Point Groups (1963): Bethe symbols of T
# Format: tests/reference/koster/bethe/README.md
#
# T: 7 irreps (4 ordinary, 3 projective), in canonical order.
# Each entry lists the characters on the identifying elements below; for a projective
# irrep they are the characters of the lifted elements in the canonical section.
# Find the row with these characters in Koster's table and copy its Gamma symbol into
# bethe ("Gamma3"; no parity sign in this group).

group = "T"
table = "Table 74, p. 79"       # Koster's table and page for this group, e.g. "Table 33, p. 62"
status = "done"                 # todo | partial | done
notes = ""                      # disagreements with Bradley & Cracknell or Bilbao; anything unreadable
elements = ["C3^1(1)", "C2(1)"]

[[irreps]]
symbol = "A"
dimension = 1
projective = false
characters = ["1", "1"]
bethe = "Gamma1"

[[irreps]]
symbol = "1E"
dimension = 1
projective = false
characters = ["zeta3", "1"]
numeric = ["-0.5000+0.8660i", "+1.0000+0.0000i"]
bethe = "Gamma2"

[[irreps]]
symbol = "2E"
dimension = 1
projective = false
characters = ["zeta3^2", "1"]
numeric = ["-0.5000-0.8660i", "+1.0000+0.0000i"]
bethe = "Gamma3"

[[irreps]]
symbol = "T"
dimension = 3
projective = false
characters = ["0", "-1"]
bethe = "Gamma4"

[[irreps]]
symbol = "E1/2"
dimension = 2
projective = true
characters = ["1", "0"]
bethe = "Gamma5"

[[irreps]]
symbol = "1E3/2"
dimension = 2
projective = true
characters = ["zeta3", "0"]
numeric = ["-0.5000+0.8660i", "+0.0000+0.0000i"]
bethe = "Gamma6"

[[irreps]]
symbol = "2E3/2"
dimension = 2
projective = true
characters = ["zeta3^2", "0"]
numeric = ["-0.5000-0.8660i", "+0.0000+0.0000i"]
bethe = "Gamma7"
