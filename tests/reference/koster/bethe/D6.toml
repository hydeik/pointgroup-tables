# Koster, Dimmock, Wheeler & Statz, Properties of the Thirty-Two Point Groups (1963): Bethe symbols of D6
# Format: tests/reference/koster/bethe/README.md
#
# D6: 9 irreps (6 ordinary, 3 projective), in canonical order.
# Each entry lists the characters on the identifying elements below; for a projective
# irrep they are the characters of the lifted elements in the canonical section.
# Find the row with these characters in Koster's table and copy its Gamma symbol into
# bethe ("Gamma3"; no parity sign in this group).

group = "D6"
table = "Table 65, p. 67"     # Koster's table and page for this group, e.g. "Table 33, p. 62"
status = "done"               # todo | partial | done
notes = ""                    # disagreements with Bradley & Cracknell or Bilbao; anything unreadable
elements = ["C6^1", "C2'(1)"]

[[irreps]]
symbol = "A1"
dimension = 1
projective = false
characters = ["1", "1"]
bethe = "Gamma1"

[[irreps]]
symbol = "A2"
dimension = 1
projective = false
characters = ["1", "-1"]
bethe = "Gamma2"

[[irreps]]
symbol = "B1"
dimension = 1
projective = false
characters = ["-1", "1"]
bethe = "Gamma3"

[[irreps]]
symbol = "B2"
dimension = 1
projective = false
characters = ["-1", "-1"]
bethe = "Gamma4"

[[irreps]]
symbol = "E1"
dimension = 2
projective = false
characters = ["1", "0"]
bethe = "Gamma5"

[[irreps]]
symbol = "E2"
dimension = 2
projective = false
characters = ["-1", "0"]
bethe = "Gamma6"

[[irreps]]
symbol = "E1/2"
dimension = 2
projective = true
characters = ["sqrt3", "0"]
numeric = ["+1.7321+0.0000i", "+0.0000+0.0000i"]
bethe = "Gamma7"

[[irreps]]
symbol = "E3/2"
dimension = 2
projective = true
characters = ["0", "0"]
bethe = "Gamma9"

[[irreps]]
symbol = "E5/2"
dimension = 2
projective = true
characters = ["-sqrt3", "0"]
numeric = ["-1.7321+0.0000i", "+0.0000+0.0000i"]
bethe = "Gamma8"
