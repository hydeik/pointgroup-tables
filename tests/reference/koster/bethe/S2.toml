# Koster, Dimmock, Wheeler & Statz, Properties of the Thirty-Two Point Groups (1963): Bethe symbols of Ci
# Format: tests/reference/koster/bethe/README.md
#
# Ci: 4 irreps (2 ordinary, 2 projective), in canonical order.
# Each entry lists the characters on the identifying elements below; for a projective
# irrep they are the characters of the lifted elements in the canonical section.
# Find the row with these characters in Koster's table and copy its Gamma symbol into
# bethe ("Gamma3", with the parity sign in this centrosymmetric group: "Gamma3+" / "Gamma3-").

group = "Ci"
table = "Table 6, p. 32" # Koster's table and page for this group, e.g. "Table 33, p. 62"
status = "done"          # todo | partial | done
notes = ""               # disagreements with Bradley & Cracknell or Bilbao; anything unreadable
elements = ["E", "i"]

[[irreps]]
symbol = "Ag"
dimension = 1
projective = false
characters = ["1", "1"]
bethe = "Gamma1+"

[[irreps]]
symbol = "Au"
dimension = 1
projective = false
characters = ["1", "-1"]
bethe = "Gamma1-"

[[irreps]]
symbol = "A1/2g"
dimension = 1
projective = true
characters = ["1", "1"]
bethe = "Gamma2+"

[[irreps]]
symbol = "A1/2u"
dimension = 1
projective = true
characters = ["1", "-1"]
bethe = "Gamma2-"
