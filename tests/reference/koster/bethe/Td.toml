# Koster, Dimmock, Wheeler & Statz, Properties of the Thirty-Two Point Groups (1963): Bethe symbols of Td
# Format: tests/reference/koster/bethe/README.md
#
# Td: 8 irreps (5 ordinary, 3 projective), in canonical order.
# Each entry lists the characters on the identifying elements below; for a projective
# irrep they are the characters of the lifted elements in the canonical section.
# Find the row with these characters in Koster's table and copy its Gamma symbol into
# bethe ("Gamma3"; no parity sign in this group).

group = "Td"
table = "Table 81, p. 88"          # Koster's table and page for this group, e.g. "Table 33, p. 62"
status = "done"                    # todo | partial | done
notes = ""                         # disagreements with Bradley & Cracknell or Bilbao; anything unreadable
elements = ["S4^-1(1)", "C3^1(1)"]

[[irreps]]
symbol = "A1"
dimension = 1
projective = false
characters = ["1", "1"]
bethe = "Gamma1"

[[irreps]]
symbol = "A2"
dimension = 1
projective = false
characters = ["-1", "1"]
bethe = "Gamma2"

[[irreps]]
symbol = "E"
dimension = 2
projective = false
characters = ["0", "-1"]
bethe = "Gamma3"

[[irreps]]
symbol = "T1"
dimension = 3
projective = false
characters = ["1", "0"]
bethe = "Gamma4"

[[irreps]]
symbol = "T2"
dimension = 3
projective = false
characters = ["-1", "0"]
bethe = "Gamma5"

[[irreps]]
symbol = "E1/2"
dimension = 2
projective = true
characters = ["sqrt2", "1"]
numeric = ["+1.4142+0.0000i", "+1.0000+0.0000i"]
bethe = "Gamma6"

[[irreps]]
symbol = "E5/2"
dimension = 2
projective = true
characters = ["-sqrt2", "1"]
numeric = ["-1.4142+0.0000i", "+1.0000+0.0000i"]
bethe = "Gamma7"

[[irreps]]
symbol = "G3/2"
dimension = 4
projective = true
characters = ["0", "-1"]
bethe = "Gamma8"
