# Koster, Dimmock, Wheeler & Statz, Properties of the Thirty-Two Point Groups (1963): Bethe symbols of D3h
# Format: tests/reference/koster/bethe/README.md
#
# D3h: 9 irreps (6 ordinary, 3 projective), in canonical order.
# Each entry lists the characters on the identifying elements below; for a projective
# irrep they are the characters of the lifted elements in the canonical section.
# Find the row with these characters in Koster's table and copy its Gamma symbol into
# bethe ("Gamma3"; no parity sign in this group).

group = "D3h"
table = ""          # Koster's table and page for this group, e.g. "Table 33, p. 62"
status = "todo"     # todo | partial | done
notes = ""          # disagreements with Bradley & Cracknell or Bilbao; anything unreadable
elements = ["S3^-1", "C3^1", "C2'(1)", "sigma_h"]

[[irreps]]
symbol = "A1'"
dimension = 1
projective = false
characters = ["1", "1", "1", "1"]
bethe = ""

[[irreps]]
symbol = "A2'"
dimension = 1
projective = false
characters = ["1", "1", "-1", "1"]
bethe = ""

[[irreps]]
symbol = "E'"
dimension = 2
projective = false
characters = ["-1", "-1", "0", "2"]
bethe = ""

[[irreps]]
symbol = "A1''"
dimension = 1
projective = false
characters = ["-1", "1", "1", "-1"]
bethe = ""

[[irreps]]
symbol = "A2''"
dimension = 1
projective = false
characters = ["-1", "1", "-1", "-1"]
bethe = ""

[[irreps]]
symbol = "E''"
dimension = 2
projective = false
characters = ["1", "-1", "0", "-2"]
bethe = ""

[[irreps]]
symbol = "E1/2"
dimension = 2
projective = true
characters = ["sqrt3", "1", "0", "0"]
numeric = ["+1.7321+0.0000i", "+1.0000+0.0000i", "+0.0000+0.0000i", "+0.0000+0.0000i"]
bethe = ""

[[irreps]]
symbol = "E3/2"
dimension = 2
projective = true
characters = ["0", "-2", "0", "0"]
bethe = ""

[[irreps]]
symbol = "E5/2"
dimension = 2
projective = true
characters = ["-sqrt3", "1", "0", "0"]
numeric = ["-1.7321+0.0000i", "+1.0000+0.0000i", "+0.0000+0.0000i", "+0.0000+0.0000i"]
bethe = ""

