# Koster, Dimmock, Wheeler & Statz, Properties of the Thirty-Two Point Groups (1963): Bethe symbols of D2
# Format: tests/reference/koster/bethe/README.md
#
# D2: 5 irreps (4 ordinary, 1 projective), in canonical order.
# Each entry lists the characters on the identifying elements below; for a projective
# irrep they are the characters of the lifted elements in the canonical section.
# Find the row with these characters in Koster's table and copy its Gamma symbol into
# bethe ("Gamma3"; no parity sign in this group).

group = "D2"
table = "Table 17, p. 36"              # Koster's table and page for this group, e.g. "Table 33, p. 62"
status = "done"                        # todo | partial | done
notes = ""                             # disagreements with Bradley & Cracknell or Bilbao; anything unreadable
elements = ["C2", "C2'(1)", "C2''(1)"]

[[irreps]]
symbol = "A"
dimension = 1
projective = false
characters = ["1", "1", "1"]
bethe = "Gamma1"

[[irreps]]
symbol = "B1"
dimension = 1
projective = false
characters = ["1", "-1", "-1"]
bethe = "Gamma3"

[[irreps]]
symbol = "B2"
dimension = 1
projective = false
characters = ["-1", "-1", "1"]
bethe = "Gamma4"

[[irreps]]
symbol = "B3"
dimension = 1
projective = false
characters = ["-1", "1", "-1"]
bethe = "Gamma2"

[[irreps]]
symbol = "E1/2"
dimension = 2
projective = true
characters = ["0", "0", "0"]
bethe = "Gamma5"
