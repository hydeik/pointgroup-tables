# Koster, Dimmock, Wheeler & Statz, Properties of the Thirty-Two Point Groups (1963): Bethe symbols of C3
# Format: tests/reference/koster/bethe/README.md
#
# C3: 6 irreps (3 ordinary, 3 projective), in canonical order.
# Each entry lists the characters on the identifying elements below; for a projective
# irrep they are the characters of the lifted elements in the canonical section.
# Find the row with these characters in Koster's table and copy its Gamma symbol into
# bethe ("Gamma3"; no parity sign in this group).

group = "C3"
table = "Table 42, p. 51" # Koster's table and page for this group, e.g. "Table 33, p. 62"
status = "done"           # todo | partial | done
notes = ""                # disagreements with Bradley & Cracknell or Bilbao; anything unreadable
elements = ["C3^1"]

[[irreps]]
symbol = "A"
dimension = 1
projective = false
characters = ["1"]
bethe = "Gamma1"

[[irreps]]
symbol = "1E"
dimension = 1
projective = false
characters = ["zeta3"]
numeric = ["-0.5000+0.8660i"]
bethe = "Gamma2"

[[irreps]]
symbol = "2E"
dimension = 1
projective = false
characters = ["zeta3^2"]
numeric = ["-0.5000-0.8660i"]
bethe = "Gamma3"

[[irreps]]
symbol = "B3/2"
dimension = 1
projective = true
characters = ["-1"]
bethe = "Gamma6"

[[irreps]]
symbol = "1E1/2"
dimension = 1
projective = true
characters = ["-zeta3^2"]
numeric = ["+0.5000+0.8660i"]
bethe = "Gamma4"

[[irreps]]
symbol = "2E1/2"
dimension = 1
projective = true
characters = ["-zeta3"]
numeric = ["+0.5000-0.8660i"]
bethe = "Gamma5"
