# Koster, Dimmock, Wheeler & Statz, Properties of the Thirty-Two Point Groups (1963): Bethe symbols of C3h
# Format: tests/reference/koster/bethe/README.md
#
# C3h: 12 irreps (6 ordinary, 6 projective), in canonical order.
# Each entry lists the characters on the identifying elements below; for a projective
# irrep they are the characters of the lifted elements in the canonical section.
# Find the row with these characters in Koster's table and copy its Gamma symbol into
# bethe ("Gamma3"; no parity sign in this group).

group = "C3h"
table = "Table 57, p. 59"               # Koster's table and page for this group, e.g. "Table 33, p. 62"
status = "done"                         # todo | partial | done
notes = ""                              # disagreements with Bradley & Cracknell or Bilbao; anything unreadable
elements = ["S3^-1", "C3^1", "sigma_h"]

[[irreps]]
symbol = "A'"
dimension = 1
projective = false
characters = ["1", "1", "1"]
bethe = "Gamma1"

[[irreps]]
symbol = "1E'"
dimension = 1
projective = false
characters = ["zeta3^2", "zeta3", "1"]
numeric = ["-0.5000-0.8660i", "-0.5000+0.8660i", "+1.0000+0.0000i"]
bethe = "Gamma2"

[[irreps]]
symbol = "2E'"
dimension = 1
projective = false
characters = ["zeta3", "zeta3^2", "1"]
numeric = ["-0.5000+0.8660i", "-0.5000-0.8660i", "+1.0000+0.0000i"]
bethe = "Gamma3"

[[irreps]]
symbol = "A''"
dimension = 1
projective = false
characters = ["-1", "1", "-1"]
bethe = "Gamma4"

[[irreps]]
symbol = "1E''"
dimension = 1
projective = false
characters = ["-zeta3^2", "zeta3", "-1"]
numeric = ["+0.5000+0.8660i", "-0.5000+0.8660i", "-1.0000+0.0000i"]
bethe = "Gamma5"

[[irreps]]
symbol = "2E''"
dimension = 1
projective = false
characters = ["-zeta3", "zeta3^2", "-1"]
numeric = ["+0.5000-0.8660i", "-0.5000-0.8660i", "-1.0000+0.0000i"]
bethe = "Gamma6"

[[irreps]]
symbol = "1E1/2"
dimension = 1
projective = true
characters = ["zeta12", "-zeta3^2", "i"]
numeric = ["+0.8660+0.5000i", "+0.5000+0.8660i", "+0.0000+1.0000i"]
bethe = "Gamma7"

[[irreps]]
symbol = "2E1/2"
dimension = 1
projective = true
characters = ["zeta12^11", "-zeta3", "-i"]
numeric = ["+0.8660-0.5000i", "+0.5000-0.8660i", "+0.0000-1.0000i"]
bethe = "Gamma8"

[[irreps]]
symbol = "1E3/2"
dimension = 1
projective = true
characters = ["i", "-1", "-i"]
numeric = ["+0.0000+1.0000i", "-1.0000+0.0000i", "+0.0000-1.0000i"]
