# Altmann & Herzig, Point-Group Theory Tables (2nd ed.): element labels of C6v
# Format: tests/reference/altmann-herzig/labels/README.md
# Drafted by tools/ah_book.py from the parameter table T 35.1 and the subgroup table T 35.0 of the book's PDF;
# the multiplication table and tilde marks are reproduced from the parameters by quaternion
# multiplication (book section 3-2) and agree with the printed factor tables (tools/ah_book.py check).

group = "C6v"
table = "T 54, p. 497"
status = "done"
source = "S. L. Altmann and P. Herzig, Point-Group Theory Tables, 2nd ed. (Wien: Clarendon, 2011)"
transcribed_by = "agent (Claude) from the OCR text of the PDF; verify against the print"
notes = """
Poles follow the book's Rule 1 (section 3-2): the poles of a class are the images of one
another under the group, not a positive-hemisphere rule; e.g. the C2' poles of D6h are the
C6 rotations of (1 0 0). Improper operations are i times the proper operation with the same
parameters (marker i implicit). Labels transliterated per README.md.
"""
# [map] is derived from these anchors; the checker fixes eps = +1 on them
anchors = ["E", "C6+", "sigma_v1"]

[book]
elements = ["E", "C6+", "C6-", "C3+", "C3-", "C2", "sigma_d1", "sigma_d2", "sigma_d3", "sigma_v1", "sigma_v2", "sigma_v3"]
master = "D6h"
irreps = ["A1", "A2", "B1", "B2", "E1", "E2", "E1/2", "E3/2", "E5/2"]

# phi and the pole n of the proper operation (the rotation part for improper ones)
[book.parameters]
"E" = { phi = "0", n = ["0", "0", "0"] }
"C6+" = { phi = "pi/3", n = ["0", "0", "1"] }
"C6-" = { phi = "pi/3", n = ["0", "0", "-1"] }
"C3+" = { phi = "2pi/3", n = ["0", "0", "1"] }
"C3-" = { phi = "2pi/3", n = ["0", "0", "-1"] }
"C2" = { phi = "pi", n = ["0", "0", "1"] }
"sigma_d1" = { phi = "pi", n = ["1", "0", "0"], proper = "C2'1" }
"sigma_d2" = { phi = "pi", n = ["-1/2", "sqrt3/2", "0"], proper = "C2'2" }
"sigma_d3" = { phi = "pi", n = ["-1/2", "-sqrt3/2", "0"], proper = "C2'3" }
"sigma_v1" = { phi = "pi", n = ["0", "1", "0"], proper = "C2''1" }
"sigma_v2" = { phi = "pi", n = ["-sqrt3/2", "-1/2", "0"], proper = "C2''2" }
"sigma_v3" = { phi = "pi", n = ["sqrt3/2", "-1/2", "0"], proper = "C2''3" }

# book label -> canonical label, derived from the anchors above
[map]
"E" = "E"
"C6+" = "C6^1"
"C6-" = "C6^-1"
"C3+" = "C3^1"
"C3-" = "C3^-1"
"C2" = "C2"
"sigma_d1" = "sigma_d(2)"
"sigma_d2" = "sigma_d(1)"
"sigma_d3" = "sigma_d(3)"
"sigma_v1" = "sigma_v(1)"
"sigma_v2" = "sigma_v(3)"
"sigma_v3" = "sigma_v(2)"

# reconstructed from the parameters; '~' marks a product the book prints with a tilde
[multiplication]
rows = [
  ["E", "C6+", "C6-", "C3+", "C3-", "C2", "sigma_d1", "sigma_d2", "sigma_d3", "sigma_v1", "sigma_v2", "sigma_v3"],
  ["C6+", "C3+", "E", "C2", "C6-", "~C3-", "~sigma_v2", "~sigma_v3", "~sigma_v1", "sigma_d2", "sigma_d3", "sigma_d1"],
  ["C6-", "E", "C3-", "C6+", "~C2", "C3+", "sigma_v3", "sigma_v1", "sigma_v2", "~sigma_d3", "~sigma_d1", "~sigma_d2"],
  ["C3+", "C2", "C6+", "~C3-", "E", "~C6-", "~sigma_d3", "~sigma_d1", "~sigma_d2", "~sigma_v3", "~sigma_v1", "~sigma_v2"],
  ["C3-", "C6-", "~C2", "E", "~C3+", "C6+", "~sigma_d2", "~sigma_d3", "~sigma_d1", "~sigma_v2", "~sigma_v3", "~sigma_v1"],
  ["C2", "~C3-", "C3+", "~C6-", "C6+", "~E", "sigma_v1", "sigma_v2", "sigma_v3", "~sigma_d1", "~sigma_d2", "~sigma_d3"],
  ["sigma_d1", "sigma_v3", "~sigma_v2", "~sigma_d2", "~sigma_d3", "~sigma_v1", "~E", "C3+", "C3-", "C2", "C6-", "~C6+"],
  ["sigma_d2", "sigma_v1", "~sigma_v3", "~sigma_d3", "~sigma_d1", "~sigma_v2", "C3-", "~E", "C3+", "~C6+", "C2", "C6-"],
  ["sigma_d3", "sigma_v2", "~sigma_v1", "~sigma_d1", "~sigma_d2", "~sigma_v3", "C3+", "C3-", "~E", "C6-", "~C6+", "C2"],
  ["sigma_v1", "~sigma_d3", "sigma_d2", "~sigma_v2", "~sigma_v3", "sigma_d1", "~C2", "~C6-", "C6+", "~E", "C3+", "C3-"],
  ["sigma_v2", "~sigma_d1", "sigma_d3", "~sigma_v3", "~sigma_v1", "sigma_d2", "C6+", "~C2", "~C6-", "C3-", "~E", "C3+"],
  ["sigma_v3", "~sigma_d2", "sigma_d1", "~sigma_v1", "~sigma_v2", "sigma_d3", "~C6-", "C6+", "~C2", "C3+", "C3-", "~E"],
]
