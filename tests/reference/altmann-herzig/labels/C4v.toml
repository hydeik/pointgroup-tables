# Altmann & Herzig, Point-Group Theory Tables (2nd ed.): element labels of C4v
# Format: tests/reference/altmann-herzig/labels/README.md
# Drafted by tools/ah_book.py from the parameter table T 33.1 and the subgroup table T 33.0 of the book's PDF;
# the multiplication table and tilde marks are reproduced from the parameters by quaternion
# multiplication (book section 3-2) and agree with the printed factor tables (tools/ah_book.py check).

group = "C4v"
table = "T 52, p. 489"
status = "done"
source = "S. L. Altmann and P. Herzig, Point-Group Theory Tables, 2nd ed. (Wien: Clarendon, 2011)"
transcribed_by = "agent (Claude) from the OCR text of the PDF; verify against the print"
notes = """
Poles follow the book's Rule 1 (section 3-2): the poles of a class are the images of one
another under the group, not a positive-hemisphere rule; e.g. the C2' poles of D6h are the
C6 rotations of (1 0 0). Improper operations are i times the proper operation with the same
parameters (marker i implicit). Labels transliterated per README.md.
"""
# [map] is derived from these anchors; the checker fixes eps = +1 on them
anchors = ["E", "C4+", "sigma_v1"]

[book]
elements = ["E", "C4+", "C4-", "C2", "sigma_v1", "sigma_v2", "sigma_d1", "sigma_d2"]
master = "D4h"
irreps = ["A1", "A2", "B1", "B2", "E", "E1/2", "E3/2"]

# phi and the pole n of the proper operation (the rotation part for improper ones)
[book.parameters]
"E" = { phi = "0", n = ["0", "0", "0"] }
"C4+" = { phi = "pi/2", n = ["0", "0", "1"] }
"C4-" = { phi = "pi/2", n = ["0", "0", "-1"] }
"C2" = { phi = "pi", n = ["0", "0", "1"] }
"sigma_v1" = { phi = "pi", n = ["1", "0", "0"], proper = "C2'1" }
"sigma_v2" = { phi = "pi", n = ["0", "1", "0"], proper = "C2'2" }
"sigma_d1" = { phi = "pi", n = ["1/sqrt2", "1/sqrt2", "0"], proper = "C2''1" }
"sigma_d2" = { phi = "pi", n = ["-1/sqrt2", "1/sqrt2", "0"], proper = "C2''2" }

# book label -> canonical label, derived from the anchors above
[map]
"E" = "E"
"C4+" = "C4^1"
"C4-" = "C4^-1"
"C2" = "C2"
"sigma_v1" = "sigma_v(1)"
"sigma_v2" = "sigma_v(2)"
"sigma_d1" = "sigma_d(1)"
"sigma_d2" = "sigma_d(2)"

# reconstructed from the parameters; '~' marks a product the book prints with a tilde
[multiplication]
rows = [
  ["E", "C4+", "C4-", "C2", "sigma_v1", "sigma_v2", "sigma_d1", "sigma_d2"],
  ["C4+", "C2", "E", "~C4-", "sigma_d1", "sigma_d2", "sigma_v2", "~sigma_v1"],
  ["C4-", "E", "~C2", "C4+", "~sigma_d2", "sigma_d1", "sigma_v1", "sigma_v2"],
  ["C2", "~C4-", "C4+", "~E", "sigma_v2", "~sigma_v1", "sigma_d2", "~sigma_d1"],
  ["sigma_v1", "~sigma_d2", "sigma_d1", "~sigma_v2", "~E", "C2", "~C4-", "C4+"],
  ["sigma_v2", "sigma_d1", "sigma_d2", "sigma_v1", "~C2", "~E", "~C4+", "~C4-"],
  ["sigma_d1", "sigma_v1", "sigma_v2", "~sigma_d2", "~C4+", "~C4-", "~E", "C2"],
  ["sigma_d2", "sigma_v2", "~sigma_v1", "sigma_d1", "C4-", "~C4+", "~C2", "~E"],
]
