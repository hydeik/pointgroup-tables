"S4z+" = { phi = "pi/2", n = ["0", "0", "-1"], proper = "C4z-" }
"sigma_d1" = { phi = "pi", n = ["1/sqrt2", "1/sqrt2", "0"], proper = "C2'a" }
"sigma_d2" = { phi = "pi", n = ["-1/sqrt2", "1/sqrt2", "0"], proper = "C2'b" }
