"sigma_d5" = { phi = "pi", n = ["1/sqrt2", "0", "-1/sqrt2"], proper = "C2'e" }
"sigma_d6" = { phi = "pi", n = ["0", "-1/sqrt2", "1/sqrt2"], proper = "C2'f" }

