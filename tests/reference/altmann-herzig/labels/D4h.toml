# Altmann & Herzig, Point-Group Theory Tables (2nd ed.): element labels of D4h
# Format: tests/reference/altmann-herzig/labels/README.md
# Drafted by tools/ah_book.py from the parameter table T 33.1 and the subgroup table T 33.0 of the book's PDF;
# the multiplication table and tilde marks are reproduced from the parameters by quaternion
# multiplication (book section 3-2) and agree with the printed factor tables (tools/ah_book.py check).

group = "D4h"
table = "T 33, p. 256"
status = "done"
source = "S. L. Altmann and P. Herzig, Point-Group Theory Tables, 2nd ed. (Wien: Clarendon, 2011)"
transcribed_by = "agent (Claude) from the OCR text of the PDF; verify against the print"
notes = """
Poles follow the book's Rule 1 (section 3-2): the poles of a class are the images of one
another under the group, not a positive-hemisphere rule; e.g. the C2' poles of D6h are the
C6 rotations of (1 0 0). Improper operations are i times the proper operation with the same
parameters (marker i implicit). Labels transliterated per README.md.
"""
# [map] is derived from these anchors; the checker fixes eps = +1 on them
anchors = ["E", "C4+", "C2'1", "i"]

[book]
elements = ["E", "C4+", "C4-", "C2", "C2'1", "C2'2", "C2''1", "C2''2", "i", "S4-", "S4+", "sigma_h", "sigma_v1", "sigma_v2", "sigma_d1", "sigma_d2"]
master = "D4h"
irreps = ["A1g", "A2g", "B1g", "B2g", "Eg", "A1u", "A2u", "B1u", "B2u", "Eu", "E1/2,g", "E3/2,g", "E1/2,u", "E3/2,u"]

# phi and the pole n of the proper operation (the rotation part for improper ones)
[book.parameters]
"E" = { phi = "0", n = ["0", "0", "0"] }
"C4+" = { phi = "pi/2", n = ["0", "0", "1"] }
"C4-" = { phi = "pi/2", n = ["0", "0", "-1"] }
"C2" = { phi = "pi", n = ["0", "0", "1"] }
"C2'1" = { phi = "pi", n = ["1", "0", "0"] }
"C2'2" = { phi = "pi", n = ["0", "1", "0"] }
"C2''1" = { phi = "pi", n = ["1/sqrt2", "1/sqrt2", "0"] }
"C2''2" = { phi = "pi", n = ["-1/sqrt2", "1/sqrt2", "0"] }
"i" = { phi = "0", n = ["0", "0", "0"], proper = "E" }
"S4-" = { phi = "pi/2", n = ["0", "0", "1"], proper = "C4+" }
"S4+" = { phi = "pi/2", n = ["0", "0", "-1"], proper = "C4-" }
"sigma_h" = { phi = "pi", n = ["0", "0", "1"], proper = "C2" }
"sigma_v1" = { phi = "pi", n = ["1", "0", "0"], proper = "C2'1" }
"sigma_v2" = { phi = "pi", n = ["0", "1", "0"], proper = "C2'2" }
"sigma_d1" = { phi = "pi", n = ["1/sqrt2", "1/sqrt2", "0"], proper = "C2''1" }
"sigma_d2" = { phi = "pi", n = ["-1/sqrt2", "1/sqrt2", "0"], proper = "C2''2" }

# book label -> canonical label, derived from the anchors above
[map]
"E" = "E"
"C4+" = "C4^1"
"C4-" = "C4^-1"
"C2" = "C2"
"C2'1" = "C2'(1)"
"C2'2" = "C2'(2)"
"C2''1" = "C2''(1)"
"C2''2" = "C2''(2)"
"i" = "i"
"S4-" = "S4^-1"
"S4+" = "S4^1"
"sigma_h" = "sigma_h"
"sigma_v1" = "sigma_v(2)"
"sigma_v2" = "sigma_v(1)"
"sigma_d1" = "sigma_d(2)"
"sigma_d2" = "sigma_d(1)"

# reconstructed from the parameters; '~' marks a product the book prints with a tilde
[multiplication]
rows = [
  ["E", "C4+", "C4-", "C2", "C2'1", "C2'2", "C2''1", "C2''2", "i", "S4-", "S4+", "sigma_h", "sigma_v1", "sigma_v2", "sigma_d1", "sigma_d2"],
  ["C4+", "C2", "E", "~C4-", "C2''1", "C2''2", "C2'2", "~C2'1", "S4-", "sigma_h", "i", "~S4+", "sigma_d1", "sigma_d2", "sigma_v2", "~sigma_v1"],
  ["C4-", "E", "~C2", "C4+", "~C2''2", "C2''1", "C2'1", "C2'2", "S4+", "i", "~sigma_h", "S4-", "~sigma_d2", "sigma_d1", "sigma_v1", "sigma_v2"],
  ["C2", "~C4-", "C4+", "~E", "C2'2", "~C2'1", "C2''2", "~C2''1", "sigma_h", "~S4+", "S4-", "~i", "sigma_v2", "~sigma_v1", "sigma_d2", "~sigma_d1"],
  ["C2'1", "~C2''2", "C2''1", "~C2'2", "~E", "C2", "~C4-", "C4+", "sigma_v1", "~sigma_d2", "sigma_d1", "~sigma_v2", "~i", "sigma_h", "~S4+", "S4-"],
  ["C2'2", "C2''1", "C2''2", "C2'1", "~C2", "~E", "~C4+", "~C4-", "sigma_v2", "sigma_d1", "sigma_d2", "sigma_v1", "~sigma_h", "~i", "~S4-", "~S4+"],
  ["C2''1", "C2'1", "C2'2", "~C2''2", "~C4+", "~C4-", "~E", "C2", "sigma_d1", "sigma_v1", "sigma_v2", "~sigma_d2", "~S4-", "~S4+", "~i", "sigma_h"],
  ["C2''2", "C2'2", "~C2'1", "C2''1", "C4-", "~C4+", "~C2", "~E", "sigma_d2", "sigma_v2", "~sigma_v1", "sigma_d1", "S4+", "~S4-", "~sigma_h", "~i"],
  ["i", "S4-", "S4+", "sigma_h", "sigma_v1", "sigma_v2", "sigma_d1", "sigma_d2", "E", "C4+", "C4-", "C2", "C2'1", "C2'2", "C2''1", "C2''2"],
  ["S4-", "sigma_h", "i", "~S4+", "sigma_d1", "sigma_d2", "sigma_v2", "~sigma_v1", "C4+", "C2", "E", "~C4-", "C2''1", "C2''2", "C2'2", "~C2'1"],
  ["S4+", "i", "~sigma_h", "S4-", "~sigma_d2", "sigma_d1", "sigma_v1", "sigma_v2", "C4-", "E", "~C2", "C4+", "~C2''2", "C2''1", "C2'1", "C2'2"],
  ["sigma_h", "~S4+", "S4-", "~i", "sigma_v2", "~sigma_v1", "sigma_d2", "~sigma_d1", "C2", "~C4-", "C4+", "~E", "C2'2", "~C2'1", "C2''2", "~C2''1"],
  ["sigma_v1", "~sigma_d2", "sigma_d1", "~sigma_v2", "~i", "sigma_h", "~S4+", "S4-", "C2'1", "~C2''2", "C2''1", "~C2'2", "~E", "C2", "~C4-", "C4+"],
  ["sigma_v2", "sigma_d1", "sigma_d2", "sigma_v1", "~sigma_h", "~i", "~S4-", "~S4+", "C2'2", "C2''1", "C2''2", "C2'1", "~C2", "~E", "~C4+", "~C4-"],
  ["sigma_d1", "sigma_v1", "sigma_v2", "~sigma_d2", "~S4-", "~S4+", "~i", "sigma_h", "C2''1", "C2'1", "C2'2", "~C2''2", "~C4+", "~C4-", "~E", "C2"],
  ["sigma_d2", "sigma_v2", "~sigma_v1", "sigma_d1", "S4+", "~S4-", "~sigma_h", "~i", "C2''2", "C2'2", "~C2'1", "C2''1", "C4-", "~C4+", "~C2", "~E"],
]
