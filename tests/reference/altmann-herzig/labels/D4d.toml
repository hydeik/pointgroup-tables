# Altmann & Herzig, Point-Group Theory Tables (2nd ed.): element labels of D4d
# Format: tests/reference/altmann-herzig/labels/README.md
# Drafted by tools/ah_book.py from the parameter table T 37.1 and the subgroup table T 37.0 of the book's PDF;
# the multiplication table and tilde marks are reproduced from the parameters by quaternion
# multiplication (book section 3-2) and agree with the printed factor tables (tools/ah_book.py check).

group = "D4d"
table = "T 43, p. 375"
status = "done"
source = "S. L. Altmann and P. Herzig, Point-Group Theory Tables, 2nd ed. (Wien: Clarendon, 2011)"
transcribed_by = "agent (Claude) from the OCR text of the PDF; verify against the print"
notes = """
Poles follow the book's Rule 1 (section 3-2): the poles of a class are the images of one
another under the group, not a positive-hemisphere rule; e.g. the C2' poles of D6h are the
C6 rotations of (1 0 0). Improper operations are i times the proper operation with the same
parameters (marker i implicit). Labels transliterated per README.md.
"""
# [map] is derived from these anchors; the checker fixes eps = +1 on them
anchors = ["E", "S8^3-", "C2'1"]

[book]
elements = ["E", "C4+", "C4-", "C2", "C2'1", "C2'2", "C2'3", "C2'4", "S8^3-", "S8^3+", "S8-", "S8+", "sigma_d1", "sigma_d2", "sigma_d3", "sigma_d4"]
master = "D8h"
irreps = ["A1", "A2", "B1", "B2", "E1", "E2", "E3", "E1/2", "E3/2", "E5/2", "E7/2"]

# phi and the pole n of the proper operation (the rotation part for improper ones)
[book.parameters]
"E" = { phi = "0", n = ["0", "0", "0"] }
"C4+" = { phi = "pi/2", n = ["0", "0", "1"] }
"C4-" = { phi = "pi/2", n = ["0", "0", "-1"] }
"C2" = { phi = "pi", n = ["0", "0", "1"] }
"C2'1" = { phi = "pi", n = ["1", "0", "0"] }
"C2'2" = { phi = "pi", n = ["0", "1", "0"] }
"C2'3" = { phi = "pi", n = ["1/sqrt2", "1/sqrt2", "0"] }
"C2'4" = { phi = "pi", n = ["-1/sqrt2", "1/sqrt2", "0"] }
"S8^3-" = { phi = "pi/4", n = ["0", "0", "1"], proper = "C8+" }
"S8^3+" = { phi = "pi/4", n = ["0", "0", "-1"], proper = "C8-" }
"S8-" = { phi = "3pi/4", n = ["0", "0", "1"], proper = "C8^3+" }
"S8+" = { phi = "3pi/4", n = ["0", "0", "-1"], proper = "C8^3-" }
"sigma_d1" = { phi = "pi", n = ["c8", "s8", "0"], proper = "C2''1" }
"sigma_d2" = { phi = "pi", n = ["-s8", "c8", "0"], proper = "C2''2" }
"sigma_d3" = { phi = "pi", n = ["s8", "c8", "0"], proper = "C2''3" }
"sigma_d4" = { phi = "pi", n = ["-c8", "s8", "0"], proper = "C2''4" }

# book label -> canonical label, derived from the anchors above
[map]
"E" = "E"
"C4+" = "C4^1"
"C4-" = "C4^-1"
"C2" = "C2"
"C2'1" = "C2'(1)"
"C2'2" = "C2'(2)"
"C2'3" = "C2''(1)"
"C2'4" = "C2''(2)"
"S8^3-" = "S8^-3"
"S8^3+" = "S8^3"
"S8-" = "S8^-1"
"S8+" = "S8^1"
"sigma_d1" = "sigma_d(1)"
"sigma_d2" = "sigma_d(3)"
"sigma_d3" = "sigma_d(2)"
"sigma_d4" = "sigma_d(4)"

# reconstructed from the parameters; '~' marks a product the book prints with a tilde
[multiplication]
rows = [
  ["E", "C4+", "C4-", "C2", "C2'1", "C2'2", "C2'3", "C2'4", "S8^3-", "S8^3+", "S8-", "S8+", "sigma_d1", "sigma_d2", "sigma_d3", "sigma_d4"],
  ["C4+", "C2", "E", "~C4-", "C2'3", "C2'4", "C2'2", "~C2'1", "S8-", "S8^3-", "~S8+", "S8^3+", "sigma_d3", "sigma_d4", "sigma_d2", "~sigma_d1"],
  ["C4-", "E", "~C2", "C4+", "~C2'4", "C2'3", "C2'1", "C2'2", "S8^3+", "S8+", "S8^3-", "~S8-", "~sigma_d4", "sigma_d3", "sigma_d1", "sigma_d2"],
  ["C2", "~C4-", "C4+", "~E", "C2'2", "~C2'1", "C2'4", "~C2'3", "~S8+", "S8-", "~S8^3+", "S8^3-", "sigma_d2", "~sigma_d1", "sigma_d4", "~sigma_d3"],
  ["C2'1", "~C2'4", "C2'3", "~C2'2", "~E", "C2", "~C4-", "C4+", "~sigma_d4", "sigma_d1", "~sigma_d2", "sigma_d3", "~S8^3+", "S8-", "~S8+", "S8^3-"],
  ["C2'2", "C2'3", "C2'4", "C2'1", "~C2", "~E", "~C4+", "~C4-", "sigma_d3", "sigma_d2", "sigma_d1", "sigma_d4", "~S8-", "~S8^3+", "~S8^3-", "~S8+"],
  ["C2'3", "C2'1", "C2'2", "~C2'4", "~C4+", "~C4-", "~E", "C2", "sigma_d1", "sigma_d3", "~sigma_d4", "sigma_d2", "~S8^3-", "~S8+", "~S8^3+", "S8-"],
  ["C2'4", "C2'2", "~C2'1", "C2'3", "C4-", "~C4+", "~C2", "~E", "sigma_d2", "sigma_d4", "sigma_d3", "~sigma_d1", "S8+", "~S8^3-", "~S8-", "~S8^3+"],
  ["S8^3-", "S8-", "S8^3+", "~S8+", "sigma_d1", "sigma_d2", "sigma_d3", "sigma_d4", "C4+", "E", "C2", "C4-", "C2'3", "C2'4", "C2'2", "~C2'1"],
  ["S8^3+", "S8^3-", "S8+", "S8-", "~sigma_d4", "sigma_d3", "sigma_d1", "sigma_d2", "E", "C4-", "C4+", "~C2", "C2'1", "C2'2", "C2'3", "C2'4"],
  ["S8-", "~S8+", "S8^3-", "~S8^3+", "sigma_d3", "sigma_d4", "sigma_d2", "~sigma_d1", "C2", "C4+", "~C4-", "E", "C2'2", "~C2'1", "C2'4", "~C2'3"],
  ["S8+", "S8^3+", "~S8-", "S8^3-", "~sigma_d2", "sigma_d1", "~sigma_d4", "sigma_d3", "C4-", "~C2", "E", "~C4+", "~C2'4", "C2'3", "C2'1", "C2'2"],
  ["sigma_d1", "~sigma_d4", "sigma_d3", "~sigma_d2", "~S8^3-", "~S8+", "~S8^3+", "S8-", "C2'1", "C2'3", "~C2'4", "C2'2", "~E", "C2", "~C4-", "C4+"],
  ["sigma_d2", "sigma_d3", "sigma_d4", "sigma_d1", "S8+", "~S8^3-", "~S8-", "~S8^3+", "C2'2", "C2'4", "C2'3", "~C2'1", "~C2", "~E", "~C4+", "~C4-"],
  ["sigma_d3", "sigma_d1", "sigma_d2", "~sigma_d4", "~S8-", "~S8^3+", "~S8^3-", "~S8+", "C2'3", "C2'2", "C2'1", "C2'4", "~C4+", "~C4-", "~E", "C2"],
