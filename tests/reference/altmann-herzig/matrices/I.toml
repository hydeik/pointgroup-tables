note = "With delta = exp(2 pi i/24) as printed the matrix cubes to +1 on its delta blocks; a spinor C3 must cube to -1, and T 70.7 prints the same blocks with the opposite sign. Read as -delta; with the transposed C5,1+ every product along the words of T 74.7a then agrees with the factor system and every trace with the character."

[[known_discrepancy]]  # a printed matrix corrected before use (docs/spec/verification.md)
element = "C5,1+"
irrep = "F3/2"
fix = "transpose"
