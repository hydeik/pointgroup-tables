eta = "zeta^15"
w = "zeta^40"
gp = "(sqrt5 + 1)/2"
gm = "(sqrt5 - 1)/2"
sp = "(sqrt3 + 1)*sqrt2/2"
sm = "(sqrt3 - 1)*sqrt2/2"
