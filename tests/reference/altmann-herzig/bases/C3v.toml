# Altmann & Herzig, Point-Group Theory Tables (2nd ed.): symmetrized bases of C3v (setting A)
# Format: tests/reference/altmann-herzig/bases/README.md
# Read from the page image of the PDF (the OCR layer drops the overlines); verify against the print.

group = "C3v"
setting = "A"
table = "T 51.6A, p. 486"
status = "done"
source = "S. L. Altmann and P. Herzig, Point-Group Theory Tables, 2nd ed. (Wien: Clarendon, 2011)"
transcribed_by = "agent (Claude) from the page image of the PDF; verify against the print"
notes = "Setting A of the book (T 51 A); the second setting is C3vB.toml."

# One entry per printed row of a two-dimensional irrep: the first ket <|j m1>, s |j -m1>| of the
# row; bullet marks the book's ungerade spin harmonics (|j m>* in the print).
[irreps."E"]
kets = [
  { j = "1", m1 = "1", s = 1, bullet = false },
]

[irreps."E1/2"]
kets = [
  { j = "1/2", m1 = "1/2", s = 1, bullet = false },
  { j = "5/2", m1 = "-5/2", s = -1, bullet = false },
  { j = "1/2", m1 = "1/2", s = -1, bullet = true },
  { j = "5/2", m1 = "-5/2", s = 1, bullet = true },
]

